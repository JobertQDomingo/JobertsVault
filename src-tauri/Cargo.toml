[package]
name = "jobertsvault"
version = "0.1.0" # not the app version: that lives only in package.json
description = "A private, offline Windows app for tracking personal cashflow"
authors = ["Jobert Domingo"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib's output files from colliding with the bin's on Windows.
name = "jobertsvault_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1" # tauri::generate_context!() needs it once tauri.conf.json has a `plugins` section
tauri = { version = "2", features = [] }
# Windows' own TLS, so there's no rustls crypto provider to install (ARCHITECTURE §2)
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
